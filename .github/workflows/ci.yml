name: ci
on:
  push:
    branches: ["**"]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg tesseract-ocr poppler-utils
      - run: npm ci
      - run: npm run typecheck && npm run typecheck:ui
      - run: npm test
      - run: npm run build && npm run build:server
