# Builds the desktop installers and attaches them to a GitHub Release.
#   git tag v0.1.0 && git push --tags        → Surface-Setup-win-x64.exe, Surface-mac-arm64.dmg, Surface-mac-x64.dmg
# surface.mantaglow.com/download/{win,mac} redirect to .../releases/latest/download/<those names>, so the hub
# page always points at the newest tag without touching the droplet.
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --win
          - os: macos-latest
            args: --mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build && npm run build:server
      - run: npx electron-builder ${{ matrix.args }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # unsigned builds for now; add CSC_LINK / CSC_KEY_PASSWORD (and APPLE_ID for notarization) when certificates exist
          CSC_IDENTITY_AUTO_DISCOVERY: false
